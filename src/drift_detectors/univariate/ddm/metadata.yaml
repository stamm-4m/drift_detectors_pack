name: "Drift Detection Method"
acronym: "DDM"
version: "1.0"
type: "univariate"
mode: "streaming"

description: >
  Monitors the online error rate and its standard deviation; warns and then signals drift when the error rate rises significantly above its minimum. Binary error stream.

inputs:
  test_data:
    description: "Batch of stream observations (consumed one at a time)."

parameters:
  min_instances:
    description: "Minimum observations before drift can be raised."
  warning_level:
    description: "Std multiplier for the warning zone."
  drift_level:
    description: "Std multiplier for the drift zone."

output:
  description: >
    Streaming result: the index at which drift was last raised in the batch.
  fields:
    last_index:
      description: "Offset within the batch where drift was raised, or -1."
    drift:
      description: "Boolean flag, True if drift was raised in this batch."
    details:
      description: "warning flag, metric name and detector state."

references:
  - "Gama, J., Medas, P., Castillo, G., & Rodrigues, P. (2004). Learning with drift detection. SBIA, LNCS 3171, 286-295."
