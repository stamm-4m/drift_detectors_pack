name: "Chi-square (triangular) divergence"
acronym: "ChiSquare"
version: "1.0"
type: "univariate"
mode: "batch"
input_kind: "signal"

description: >
  Symmetric (triangular) chi-square divergence between histograms, bounded [0, 1]. Implemented in pure NumPy on a common histogram (or empirical CDF)
  of the reference and test samples.

inputs:
  reference_data:
    description: "Reference (baseline) univariate sample."
  test_data:
    description: "Test univariate sample to compare against the reference."

parameters:
  threshold:
    description: "Drift threshold on the distance/divergence score."
  bins:
    description: "Number of histogram bins (histogram-based metrics)."

output:
  description: >
    Returns the distance/divergence score, a drift flag, and metadata.
  fields:
    score:
      description: "The distance/divergence between reference and test."
    drift:
      description: "Boolean flag, True when score >= threshold."
    details:
      description: "threshold, bins, metric name and sample sizes."

references:
  - "Pearson, K. (1900). On the criterion that a given system of deviations from the probable... Philosophical Magazine 50(302), 157-175."
